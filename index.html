<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionBiz</title>

    <!-- Open Graph — lido pelo WhatsApp ao gerar preview de link -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="VisionBiz" />
    <meta property="og:title"       content="VisionBiz — Portal do Cliente" />
    <meta property="og:description" content="Acesse seus documentos, guias e obrigações fiscais." />
    <meta property="og:image"       content="%VITE_APP_URL%/og-preview.png" />
    <meta property="og:url"         content="%VITE_APP_URL%" />

    <!-- Twitter / WhatsApp fallback -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VisionBiz — Portal do Cliente" />
    <meta name="twitter:description" content="Acesse seus documentos, guias e obrigações fiscais." />
    <meta name="twitter:image"       content="%VITE_APP_URL%/og-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
